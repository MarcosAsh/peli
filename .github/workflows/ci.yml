name: ci

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build_and_smoke:
    name: build + smoke (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
        python-version: ["3.10", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install FFmpeg (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libavcodec-dev libavformat-dev libavutil-dev \
            libswresample-dev libavfilter-dev libavdevice-dev

      - name: Install FFmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg

      - name: Build and install peli
        run: |
          python -m pip install --upgrade pip
          python -m pip install . -v

      - name: Smoke test
        run: |
          python -c "
          import peli
          vr = peli.VideoReader('examples/count.mov', output='numpy')
          assert len(vr) == 143, f'expected 143 frames, got {len(vr)}'
          batch = vr.get_batch([0, 30, 60, 90])
          assert batch.shape == (4, 720, 1080, 3), batch.shape
          print('smoke ok:', peli.__version__, len(vr), 'frames')
          "
