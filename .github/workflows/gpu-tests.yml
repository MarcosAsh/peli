name: gpu-tests

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "src/**"
      - "include/**"
      - "python/**"
      - "tests/**"
      - "CMakeLists.txt"
      - "pyproject.toml"
      - ".github/workflows/gpu-tests.yml"
      - "tests/gpu/modal_runner.py"

jobs:
  gpu_tests_on_modal:
    name: build + pytest on Modal L4
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install modal
        run: python -m pip install --upgrade pip modal

      - name: Run GPU build and tests on Modal
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: modal run tests/gpu/modal_runner.py
