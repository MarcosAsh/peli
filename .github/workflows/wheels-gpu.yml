name: wheels-gpu

# v0.2 scaffolding for the peli-gpu (NVDEC) wheel pipeline.
#
# What this does today:
#   - Builds peli with USE_CUDA=ON inside a NVIDIA CUDA-devel container.
#   - Verifies the C extension links against libnvcuvid (no GPU runtime tests
#     here — GitHub-hosted runners don't have NVIDIA GPUs).
#   - Uploads the resulting .whl as a workflow artifact for inspection.
#
# What this does NOT do yet (v0.2.x):
#   - Publish to PyPI as `peli-gpu` (we'd need a renamed pyproject + trusted-publisher).
#   - Run GPU smoke tests (need self-hosted runner or Modal-based step).
#   - Multi-CUDA / multi-Python matrix.
#
# Trigger via the Actions tab > "wheels-gpu" > "Run workflow", or by pushing
# a tag matching `v*-gpu`.

on:
  workflow_dispatch:
  push:
    tags: ["v*-gpu"]

jobs:
  build_gpu_wheel:
    name: gpu-wheel cuda${{ matrix.cuda }} py${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Single point in the matrix until the basic pipeline is green.
        cuda: ["12.6.3"]
        python: ["3.12"]

    container:
      image: nvidia/cuda:${{ matrix.cuda }}-cudnn-devel-ubuntu24.04
      # No --gpus runtime here; we only need the dev toolkit, not a runtime
      # GPU. Build is hardware-independent; libnvcuvid resolves at load time.

    steps:
      - name: Install Python and build deps
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            python${{ matrix.python }} python${{ matrix.python }}-dev python${{ matrix.python }}-venv \
            build-essential cmake git pkg-config curl \
            libavcodec-dev libavformat-dev libavutil-dev \
            libswresample-dev libavfilter-dev libavdevice-dev
          curl -sS https://bootstrap.pypa.io/get-pip.py | python${{ matrix.python }}
          python${{ matrix.python }} -m pip install --upgrade pip build wheel

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Symlink libnvcuvid for build-time linking
        # The CUDA-devel image ships libnvcuvid stubs at /usr/local/cuda/lib64/stubs/.
        # CMake's find_library wants an unversioned libnvcuvid.so on the search path.
        run: |
          ls -la /usr/local/cuda/lib64/stubs/libnvcuvid.so 2>&1 || true
          if [ -f /usr/local/cuda/lib64/stubs/libnvcuvid.so ]; then
            ln -sf /usr/local/cuda/lib64/stubs/libnvcuvid.so /usr/local/cuda/lib64/libnvcuvid.so
          fi
          ls -la /usr/local/cuda/lib64/libnvcuvid.so* 2>&1 || true

      - name: Build wheel with USE_CUDA=ON
        env:
          CMAKE_ARGS: "-DUSE_CUDA=ON -DCMAKE_CUDA_ARCHITECTURES=75;80;86;89;90"
        run: |
          python${{ matrix.python }} -m build --wheel --outdir dist
          ls -la dist/

      - name: Show wheel contents and CUDA symbol summary
        run: |
          python${{ matrix.python }} -m pip install wheel
          for whl in dist/*.whl; do
            echo "== $whl =="
            python${{ matrix.python }} -m wheel unpack "$whl" --dest /tmp/unpacked
          done
          find /tmp/unpacked -name 'libpeli*' -exec ls -la {} \;
          find /tmp/unpacked -name 'libpeli*' -exec sh -c 'nm -D "$1" 2>/dev/null | grep -iE "cuvid|nvdec|cuda" | head -20' _ {} \;

      - uses: actions/upload-artifact@v4
        with:
          name: peli-gpu-cuda${{ matrix.cuda }}-py${{ matrix.python }}
          path: dist/*.whl
          retention-days: 30
