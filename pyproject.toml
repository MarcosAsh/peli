[build-system]
requires = ["scikit-build-core>=0.10"]
build-backend = "scikit_build_core.build"

[project]
name = "peli"
version = "0.1.0"
description = "Backend-agnostic video decoder for ML frameworks (NumPy/PyTorch/JAX/TF/Keras via DLPack). Fork of dmlc/decord."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "peli contributors" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Video",
    "Topic :: Scientific/Engineering",
]
dependencies = ["numpy>=1.22"]

[project.urls]
Homepage = "https://github.com/MarcosAsh/peli"
Issues   = "https://github.com/MarcosAsh/peli/issues"
Source   = "https://github.com/MarcosAsh/peli"

[tool.scikit-build]
minimum-version = "0.10"
cmake.version = ">=3.18"
build-dir = "build/{wheel_tag}"
wheel.packages = ["python/peli"]
install.components = ["python"]
build.verbose = true

[tool.cibuildwheel]
build = "cp310-* cp311-* cp312-* cp313-* cp314-*"
skip = ["*-manylinux_i686", "*-musllinux_*", "pp*", "*-win32"]
build-verbosity = 1
test-command = "python -c \"import peli; vr = peli.VideoReader(r'{project}/examples/count.mov'); assert len(vr) == 143; print('ok', len(vr), 'frames')\""

[tool.cibuildwheel.linux]
manylinux-x86_64-image = "manylinux_2_28"
manylinux-aarch64-image = "manylinux_2_28"
environment = { PKG_CONFIG_PATH = "/usr/local/lib/pkgconfig", LD_LIBRARY_PATH = "/usr/local/lib" }
before-all = [
    "dnf install -y nasm yasm",
    "curl -fsSL https://www.ffmpeg.org/releases/ffmpeg-7.1.tar.xz -o /tmp/ffmpeg.tar.xz",
    "cd /tmp && tar xf ffmpeg.tar.xz",
    "cd /tmp/ffmpeg-7.1 && ./configure --prefix=/usr/local --enable-shared --disable-static --disable-doc --disable-programs --disable-debug --disable-gpl --disable-nonfree",
    "cd /tmp/ffmpeg-7.1 && make -j$(nproc) && make install",
    "ldconfig",
]
repair-wheel-command = "auditwheel repair -w {dest_dir} {wheel}"

[tool.cibuildwheel.macos]
before-all = ["brew install ffmpeg"]
environment = { MACOSX_DEPLOYMENT_TARGET = "14.0" }
archs = ["x86_64", "arm64"]

[tool.cibuildwheel.windows]
before-all = [
    "vcpkg install ffmpeg:x64-windows",
]
environment = { CMAKE_TOOLCHAIN_FILE = "C:/vcpkg/scripts/buildsystems/vcpkg.cmake" }
repair-wheel-command = "delvewheel repair -w {dest_dir} {wheel}"

[tool.pytest.ini_options]
testpaths = ["tests/python"]
